spring:
  application:
    name: BusTicketApp
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}

springdoc:
  swagger-ui:
    url: /openapi.yaml
jwt:
  secret: ${JWT_SECRET}
  audience: ${JWT_AUDIENCE}
  issuer: ${JWT_ISSUER}